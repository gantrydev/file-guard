[package]
name = "file-guard"
version = "0.3.0"
edition = "2024"
description = "Per-process credential access control daemon for Linux (FUSE)"
license = "MIT"
# Distributed via Nix flake + Debian package, not crates.io. It's an
# application, not a library, so block accidental `cargo publish`.
publish = false

# ── Debian packaging (cargo-deb) ─────────────────────────────────────────────
# Build: `cargo deb` → target/debian/file-guard_<ver>_<arch>.deb
# See packaging/README.md for the unit layout and setup steps.
[package.metadata.deb]
maintainer = "gantrydev <dianfishekqi@gmail.com>"
section = "admin"
priority = "optional"
extended-description = """
Per-process access control for on-disk credential files. file-guard mounts a \
FUSE file over each watched secret and only lets binaries you have authorized \
(pinned by content hash, and script path for interpreters) read or write it; \
everything else is denied or prompted via a desktop agent."""
# fuse3 provides recovery utilities; $auto adds detected shared-library deps.
depends = "fuse3, logrotate, $auto"
recommends = "zenity (>= 3.16.2), libnotify-bin"
conf-files = ["/etc/file-guard/config.toml", "/etc/default/file-guard", "/etc/logrotate.d/file-guard"]
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/file-guard", "usr/bin/", "755"],
    ["packaging/config.toml", "etc/file-guard/config.toml", "644"],
    ["packaging/default/file-guard", "etc/default/file-guard", "644"],
    ["packaging/logrotate/file-guard", "etc/logrotate.d/file-guard", "644"],
    ["packaging/systemd/file-guard.service", "lib/systemd/system/file-guard.service", "644"],
    ["packaging/systemd/file-guard-agent@.socket", "lib/systemd/system/file-guard-agent@.socket", "644"],
    ["packaging/systemd/file-guard-agent@.service", "lib/systemd/system/file-guard-agent@.service", "644"],
    ["packaging/tmpfiles/file-guard.conf", "usr/lib/tmpfiles.d/file-guard.conf", "644"],
    ["README.md", "usr/share/doc/file-guard/README.md", "644"],
    ["packaging/README.md", "usr/share/doc/file-guard/PACKAGING.md", "644"],
    ["docs/storage-v2.md", "usr/share/doc/file-guard/docs/storage-v2.md", "644"],
    ["configs/*.toml", "usr/share/doc/file-guard/configs/", "644"],
    ["LICENSE", "usr/share/doc/file-guard/LICENSE", "644"],
    ["THIRD_PARTY_NOTICES", "usr/share/doc/file-guard/THIRD_PARTY_NOTICES", "644"],
]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Config
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Path expansion
dirs = "7.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Log serialization
serde_json = "1.0"

# Platform FFI
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["user"] }
libsystemd = "0.7"

# File locking (config, log) via rustix::fs::flock
rustix = { version = "1.1.4", features = ["event", "fs", "mount", "param", "process"] }

# Atomic snapshot journal
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

# Binary identity pinning (re-prompt when a binary changes)
sha2 = "0.11"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"
# /proc filesystem reader (process info without whole-table scan)
procfs = "0.18"

[dev-dependencies]
tempfile = "3.27"
