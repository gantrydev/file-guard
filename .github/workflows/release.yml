name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfuse3-dev
      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Build .deb
        run: cargo deb --locked
      - name: Package archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SYSTEM: ${{ matrix.system }}
        run: |
          install -Dm755 target/release/file-guard "dist/file-guard"
          install -m644 LICENSE THIRD_PARTY_NOTICES dist/
          mkdir -p release
          tar -C dist -czf "release/file-guard-${RELEASE_TAG}-${SYSTEM}.tar.gz" file-guard LICENSE THIRD_PARTY_NOTICES
      - name: Test built archive without Nix
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SYSTEM: ${{ matrix.system }}
        run: |
          docker run --rm --network none --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD/release/file-guard-${RELEASE_TAG}-${SYSTEM}.tar.gz,dst=/tmp/file-guard.tar.gz,readonly" \
            ubuntu:24.04 sh -ec '
              test ! -e /nix
              mkdir /tmp/extracted
              tar -xzf /tmp/file-guard.tar.gz -C /tmp/extracted
              test -s /tmp/extracted/LICENSE
              test -s /tmp/extracted/THIRD_PARTY_NOTICES
              /tmp/extracted/file-guard --help
              /tmp/extracted/file-guard agent --help
            '
      - name: Test built .deb
        env:
          FILE_GUARD_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          packages=(target/debian/*.deb)
          [[ "${#packages[@]}" -eq 1 ]]
          FILE_GUARD_DEB_PATH="${packages[0]}" scripts/test-deb-release.sh
          cp "${packages[0]}" release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.system }}
          path: release/*
          if-no-files-found: error

  attest:
    needs: build
    strategy:
      matrix:
        system: [x86_64-linux, aarch64-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.system }}
          path: release
      - name: Attest release artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Preserve attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          SYSTEM: ${{ matrix.system }}
        run: cp "$BUNDLE_PATH" "release/file-guard-${SYSTEM}.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.system }}
          path: release/*
          if-no-files-found: error

  release:
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify provenance and generate checksums
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for system in x86_64-linux aarch64-linux; do
            case "$system" in
              x86_64-linux) arch=amd64 ;;
              aarch64-linux) arch=arm64 ;;
            esac
            for artifact in file-guard-*"$system".tar.gz file-guard_*"$arch".deb; do
              gh attestation verify "$artifact" \
                --bundle "file-guard-${system}.sigstore.json" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners
            done
          done
          sha256sum ./*.tar.gz ./*.deb > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Linux x86_64 and ARM64 builds. Requires Linux FUSE support.
            Debian/Ubuntu packages are attached for amd64 and arm64.
            All archives and packages have signed GitHub build provenance.
            Attestation bundles and SHA256SUMS are attached; see packaging/README.md for verification.

  test-release:
    needs: release
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test published .deb
        env:
          FILE_GUARD_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/test-deb-release.sh
