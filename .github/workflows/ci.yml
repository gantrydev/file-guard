name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fully gated path: matches what we verify locally via the flake dev shell.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: rustfmt
        run: nix develop --command cargo fmt --check
      - name: actionlint
        run: nix develop --command actionlint
      - name: pinned actions
        run: nix develop --command pinact run -fix=false -no-api
      - name: clippy (deny warnings)
        run: nix develop --command cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: nix develop --command cargo test --locked
      - name: FUSE integration tests
        run: |
          test -c /dev/fuse
          nix develop --command cargo test --locked fuse_fs::integration_tests -- --ignored --test-threads=1
      - name: build package
        run: nix build .#file-guard
