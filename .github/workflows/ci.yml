name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fully gated path: matches what we verify locally via the flake dev shell.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: rustfmt
        run: nix develop --command cargo fmt --check
      - name: clippy (deny warnings)
        run: nix develop --command cargo clippy --all-targets -- -D warnings
      - name: test
        run: nix develop --command cargo test
      - name: FUSE integration tests
        run: |
          test -c /dev/fuse
          nix develop --command cargo test fuse_fs::integration_tests -- --ignored --test-threads=1
      - name: build package
        run: nix build .#file-guard
